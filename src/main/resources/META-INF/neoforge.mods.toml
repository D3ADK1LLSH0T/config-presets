modLoader="javafml"
loaderVersion="[3,]"
license="MIT"
issueTrackerURL="https://github.com/D3ADK1LLSH0T/config-presets/issues"

[[mods]]
    modId="configpresets"
    version="${mod_version}"
    displayName="Config Presets"
    authors="D3ADK1LLSH0T"
    logoFile="icon.png"
    description='''
Config Presets lets you save your Minecraft options, mod settings, and resource pack selections as named presets and instantly switch between them.
'''

[[dependencies.configpresets]]
    modId="neoforge"
    type="required"
    versionRange="[${neoforge_version},)"
    ordering="NONE"
    side="CLIENT"

[[dependencies.configpresets]]
    modId="minecraft"
    type="required"
    versionRange="26.1.2"
    ordering="NONE"
    side="BOTH"
