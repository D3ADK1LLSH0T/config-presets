# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Properties
mod_version=0.0.3
maven_group=com.configpresets
archives_base_name=config-presets-neoforge

# Custom jar naming: config-presets-<loader>-v<mod_version>+<mc_short>
# Short Minecraft version used in the jar file name
mc_short=26.2

# Minecraft / NeoForge versions
minecraft_version=26.2
# NeoForge 26.2.0.x targets Minecraft 26.2
neoforge_version=26.2.0.93
