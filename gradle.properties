# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# NOTE: Minecraft 26.X uses Mojang's official mappings (configured in build.gradle
# via loom.officialMojangMappings()), so there is no yarn_mappings property.
minecraft_version=26.3
loader_version=0.19.5

# Mod Properties
mod_version=0.0.4
maven_group=com.configpresets
archives_base_name=config-presets

# Custom jar naming: config-presets-<loader>-v<mod_version>+<mc_short>
# Short Minecraft version used in the jar file name
mc_short=26.3

# Dependencies
fabric_version=0.164.0+26.3
cloth_config_version=26.3.159
modmenu_version=21.0.0
