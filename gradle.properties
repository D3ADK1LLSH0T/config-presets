# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Mod Properties
mod_version=0.1
maven_group=com.configpresets
archives_base_name=config-presets-neoforge

# Custom jar naming: config-presets-<loader>-<build_type>v<mod_version>+<mc_short>
# build_type: A=Alpha, B=Beta, RC=Release Candidate, R=Release
build_type=A
# Short Minecraft version used in the jar file name
mc_short=1.21.11

# Minecraft / NeoForge versions
minecraft_version=1.21.11
# NeoForge 21.11.x targets Minecraft 1.21.11
neoforge_version=21.11.42
