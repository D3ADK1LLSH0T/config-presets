# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# Fabric Properties
# check these on https://fabricmc.net/develop
# NOTE: Minecraft 26.X uses Mojang's official mappings (configured in build.gradle
# via loom.officialMojangMappings()), so there is no yarn_mappings property.
minecraft_version=26.1.2
loader_version=0.19.3

# Mod Properties
mod_version=0.1
maven_group=com.configpresets
archives_base_name=config-presets

# Custom jar naming: config-presets-<loader>-<build_type>v<mod_version>+<mc_short>
# build_type: A=Alpha, B=Beta, RC=Release Candidate, R=Release
build_type=A
# Short Minecraft version used in the jar file name (e.g. 26.1 instead of 26.1.2)
mc_short=26.1

# Dependencies
fabric_version=0.150.0+26.1.2
cloth_config_version=26.1.154
modmenu_version=18.0.0-beta.1
