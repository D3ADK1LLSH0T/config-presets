plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.3'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    // Minecraft 26.X ships de-obfuscated (against Mojang's official names), so the
    // non-remapping `net.fabricmc.fabric-loom` plugin is used and there is no
    // `mappings` dependency at all (see the dependencies block). No Yarn-specific
    // workarounds are required anymore.
}

repositories {
    // Cloth Config + Mod Menu
    maven {
        name = 'Shedaniel'
        url = 'https://maven.shedaniel.me/'
    }
    maven {
        name = 'Terraformers'
        url = 'https://maven.terraformersmc.com/releases/'
    }
    mavenCentral()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Minecraft 26.X is distributed de-obfuscated (already on Mojang's official
    // names), so NO `mappings` dependency is declared. Declaring one (e.g.
    // loom.officialMojangMappings()) fails with "Cannot use Mojang mappings in a
    // non-obfuscated environment" under the non-remapping plugin.

    // With official Mojang mappings the dependencies are no longer remapped from
    // intermediary, so the plain Gradle configurations are used instead of the
    // mod-prefixed ones (modImplementation / modApi / modRuntimeOnly).
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // Cloth Config - GUI config library
    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }

    // Mod Menu - integration entry point (optional)
    implementation "com.terraformersmc:modmenu:${project.modmenu_version}"
}

processResources {
    inputs.property "version", project.version

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Minecraft 26.X targets Java 25. The toolchain lets Gradle locate and use a
    // JDK 25 for compilation regardless of the JDK that runs Gradle itself.
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }

    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {
        // Add repositories to publish to here.
    }
}
