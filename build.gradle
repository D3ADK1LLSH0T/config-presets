plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    // Custom jar name: config-presets-neoforge-v<mod_version>+<mc_short>
    // e.g. config-presets-neoforge-v0.0.1+1.21.11
    archivesName = "config-presets-neoforge-v${project.mod_version}+${project.mc_short}"
}

// mod_version is already encoded in archivesName, so don't append it again as the
// archive version suffix (avoids a trailing "-0.1" in the jar file name).
tasks.withType(AbstractArchiveTask).configureEach {
    archiveVersion = ''
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
    withSourcesJar()
}

repositories {
    mavenCentral()
}

neoForge {
    version = project.neoforge_version

    // Mixin support: register the mod's mixin config so it is applied at runtime.
    mods {
        configpresets {
            sourceSet sourceSets.main
        }
    }

    // Development run configurations.
    runs {
        client {
            client()
        }
    }
}

dependencies {
    // NeoForge itself is supplied by the neoForge { version = ... } block above.
    // Gson is bundled with Minecraft, so no extra dependency is needed.
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            mod_version       : project.mod_version,
            minecraft_version : project.minecraft_version,
            neoforge_version  : project.neoforge_version
    ]
    inputs.properties(replaceProperties)

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
    it.options.encoding = 'UTF-8'
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
    repositories {
        // Add repositories to publish to here.
    }
}
